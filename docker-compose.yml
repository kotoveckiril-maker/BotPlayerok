services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botplayerok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_please}
      POSTGRES_DB: ${POSTGRES_DB:-botplayerok}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-botplayerok} -d ${POSTGRES_DB:-botplayerok}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-botplayerok}:${POSTGRES_PASSWORD:-change_me_please}@db:5432/${POSTGRES_DB:-botplayerok}
      DATA_DIR: /app/data
      TZ: ${TZ:-Europe/Moscow}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SETTINGS_SECRET: ${SETTINGS_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
